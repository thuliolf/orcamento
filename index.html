<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orçamento de Eventos</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="app">
    <header class="barra">
      <h1>Orçamento de Eventos</h1>
      <nav class="abas" role="tablist">
        <button role="tab" data-aba="orcamento" aria-selected="true">Orçamento</button>
        <button role="tab" data-aba="indicadores" aria-selected="false">Indicadores</button>
      </nav>
      <nav>
        <button id="btn-novo">Novo</button>
        <button id="btn-abrir">Abrir…</button>
        <button id="btn-salvar" class="principal">Salvar</button>
        <button id="btn-imprimir">Imprimir</button>
        <input type="file" id="arquivo" accept=".json,application/json" hidden>
      </nav>
    </header>

    <main id="aba-orcamento">
      <section class="cabecalho">
        <label>Empresa <input data-cab="empresa" placeholder="Nome da sua empresa"></label>
        <div class="campo-logo">
          <span>Logo da empresa</span>
          <div>
            <img id="logo-previa" alt="Logo" hidden>
            <button id="btn-logo" class="discreto">Carregar…</button>
            <button id="btn-logo-remover" class="discreto perigo" hidden>Remover</button>
            <input type="file" id="logo-arquivo" accept="image/*" hidden>
          </div>
        </div>
        <label>Identificação <input data-cab="identificacao" placeholder="Ex.: Festa de fim de ano 2026"></label>
        <label>Cliente <input data-cab="cliente"></label>
        <label>Data do evento <input type="date" data-cab="data"></label>
        <label>Horário e local <input data-cab="local" placeholder="Ex.: 19h, Salão Central"></label>
        <label>Imposto (%) <input data-cab="imposto" class="num" inputmode="decimal"></label>
        <label>Markup padrão (%) <input data-cab="markup" class="num" inputmode="decimal"
          title="Usado para calcular o valor cobrado a partir do valor real"></label>
        <button id="btn-padrao" class="discreto" title="Novos orçamentos começam com esta empresa, logo, imposto e markup">Usar como padrão</button>
      </section>

      <div id="grupos"></div>
      <button id="btn-grupo" class="adicionar">+ Grupo</button>

      <section class="total-geral">
        <h2>Total do orçamento</h2>
        <dl id="total"></dl>
      </section>
    </main>

    <main id="aba-indicadores" hidden></main>
  </div>

  <div id="impressao"></div>
  <div id="dica" role="tooltip" hidden></div>

  <script src="calc.js?v=3"></script>
  <script src="app.js?v=3"></script>
  <script src="indicadores.js?v=3"></script>
  <script src="grafico-cliente.js?v=3"></script>
</body>
</html>
